<!DOCTYPE html>
<html lang="uz" translate="no">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amatora - O'yinchi Profili</title>
    <meta name="description" content="Amatora futbol ligasida ishtirok etuvchi o'yinchi profili, statistika va batafsil ma'lumotlari.">
    <meta name="keywords" content="o'yinchi profili, futbolchi, statistika, amatora liga">
    <meta property="og:title" content="Amatora - O'yinchi Profili">
    <meta property="og:description" content="O'yinchi profili va statistikasi bilan tanishing.">
    <meta property="og:image" content="https://havasliga.uz/images/logo.png">
    <meta property="og:type" content="website">

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" href="images/app-icon-rounded.png">
    <link rel="apple-touch-icon" href="images/app-icon-rounded.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Amatora">
    <meta name="theme-color" content="#0a0a0f">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .player-profile-hero {
            position: relative;
            background: linear-gradient(135deg, rgba(18,20,29,0.95) 0%, rgba(30,35,55,0.9) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 40px 32px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        .player-profile-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(192,132,252,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .player-profile-hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,255,102,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .player-hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 32px;
        }
        .player-photo-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .player-photo-main {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(192,132,252,0.5);
            box-shadow: 0 0 40px rgba(192,132,252,0.25);
        }
        .player-number-ring {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #C084FC, #7C3AED);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            border: 3px solid #0F121A;
            box-shadow: 0 4px 15px rgba(192,132,252,0.4);
        }
        .player-info-main h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            color: #fff;
            margin: 0 0 8px 0;
            line-height: 1.1;
        }
        .player-position-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,255,102,0.1);
            border: 1px solid rgba(0,255,102,0.3);
            color: #00FF66;
            font-weight: 800;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .player-stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .player-stat-card {
            background: rgba(18,20,29,0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        .player-stat-card:hover {
            border-color: rgba(192,132,252,0.4);
            transform: translateY(-2px);
        }
        .player-stat-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .player-stat-label {
            font-size: 11px;
            font-weight: 700;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .player-stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }
        .player-team-section {
            background: rgba(18,20,29,0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 32px;
        }
        .player-team-header {
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .player-team-header:hover {
            opacity: 0.85;
        }
        .player-team-logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            object-fit: contain;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 8px;
        }
        .player-team-name {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
        }
        .player-team-league {
            font-size: 13px;
            font-weight: 700;
            color: #00FF66;
            margin-top: 4px;
        }
        .teammates-section {
            margin-top: 28px;
        }
        .teammates-title {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #C084FC;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .teammates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .teammate-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .teammate-card:hover {
            border-color: rgba(192,132,252,0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .teammate-photo {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 8px;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .teammate-name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .teammate-pos {
            font-size: 10px;
            color: #94A3B8;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Loading skeleton */
        .player-loading {
            text-align: center;
            padding: 80px 20px;
        }
        .player-loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #C084FC;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            .player-hero-content {
                flex-direction: column;
                text-align: center;
            }
            .player-photo-main {
                width: 120px;
                height: 120px;
            }
            .player-number-ring {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .player-info-main h1 {
                font-size: 26px;
            }
            .player-stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .teammates-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .teammate-card {
                padding: 10px 6px;
            }
            .teammate-photo {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>

    <div class="site-container">
        <div style="margin-bottom: 20px;">
            <a href="javascript:history.back()" class="btn-secondary" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; text-decoration: none; color: var(--text-muted); background: transparent; border: 1px solid var(--glass-border); transition: all 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'; this.style.color='#fff';" onmouseout="this.style.background='transparent'; this.style.color='var(--text-muted)';">
                <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i> Ortga qaytish
            </a>
        </div>

        <!-- Loading State -->
        <div id="playerLoading" class="player-loading">
            <div class="player-loading-spinner"></div>
            <div style="color: #94A3B8; font-weight: 700; font-size: 14px;">O'yinchi ma'lumotlari yuklanmoqda...</div>
        </div>

        <!-- Player Content (hidden until loaded) -->
        <div id="playerContent" class="hidden">
            <!-- Hero Section -->
            <div class="player-profile-hero">
                <div class="player-hero-content">
                    <div class="player-photo-wrapper">
                        <img id="pPhoto" class="player-photo-main" src="" alt="O'yinchi rasmi">
                        <div id="pNumberRing" class="player-number-ring">#</div>
                    </div>
                    <div class="player-info-main">
                        <h1 id="pFullName">Ism Familiya</h1>
                        <div id="pPositionBadge" class="player-position-badge">
                            ⚽ Futbolchi
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="player-stats-row">
                <div class="player-stat-card">
                    <div class="player-stat-icon">📅</div>
                    <div class="player-stat-label">Tug'ilgan sana</div>
                    <div class="player-stat-value" id="pBirthDate">-</div>
                </div>
                <div class="player-stat-card">
                    <div class="player-stat-icon">🎽</div>
                    <div class="player-stat-label">Raqam</div>
                    <div class="player-stat-value" id="pNumber">-</div>
                </div>
                <div class="player-stat-card">
                    <div class="player-stat-icon">🛡️</div>
                    <div class="player-stat-label">Jamoa</div>
                    <div class="player-stat-value" id="pTeamName">-</div>
                </div>
                <div class="player-stat-card">
                    <div class="player-stat-icon">🏆</div>
                    <div class="player-stat-label">Liga</div>
                    <div class="player-stat-value" id="pLeague">-</div>
                </div>
            </div>

            <!-- Team Section -->
            <div id="teamSection" class="player-team-section hidden">
                <div class="player-team-header" id="teamHeaderLink">
                    <img id="teamLogo" class="player-team-logo" src="" alt="Jamoa logotipi">
                    <div>
                        <div id="teamName" class="player-team-name">Jamoa</div>
                        <div id="teamLeague" class="player-team-league">Liga</div>
                    </div>
                </div>

                <div class="teammates-section">
                    <div class="teammates-title">👥 Jamodoshlar</div>
                    <div id="teammatesGrid" class="teammates-grid">
                        <!-- Teammates injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Error state -->
        <div id="playerError" class="hidden" style="text-align:center; padding:60px 20px;">
            <div style="font-size:48px; margin-bottom:16px;">😕</div>
            <h2 style="font-family:'Outfit',sans-serif; color:#fff; margin-bottom:8px;">O'yinchi topilmadi</h2>
            <p style="color:#94A3B8; margin-bottom:24px;">Ushbu o'yinchi bazada mavjud emas yoki o'chirilgan.</p>
            <a href="teams.html" style="color:#00FF66; font-weight:700; text-decoration:none;">Jamoalarga qaytish →</a>
        </div>
    </div>

    <!-- Scripts -->
    <script>lucide.createIcons();</script>
    <script src="js/layout.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/player-details.js"></script>
</body>
</html>
