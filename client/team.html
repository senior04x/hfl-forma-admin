<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HFL - Jamoaviy ro'yxatdan o'tish</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .team-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .section-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        .player-card img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }
        .player-card-info h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
        }
        .player-card-info p {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
        }
        .remove-player {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .add-player-btn {
            width: 100%;
            background: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .add-player-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal.hidden {
            display: none;
        }
        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
        }
        
        /* Progress Modal */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="team-container" style="position: relative; z-index: 2;">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 20px; color: white; text-decoration: none; font-weight: 500; font-size: 14px; border: 1px solid rgba(255,255,255,0.2);">
                <i data-lucide="user" style="width: 18px; height: 18px;"></i> Yakkaxon ro'yxatdan o'tish
            </a>
        </div>

        <header class="header" style="text-align: center; margin-bottom: 30px;">
            <div class="logo-container">
                <i data-lucide="shield" style="width: 40px; height: 40px; color: var(--primary);"></i>
            </div>
            <h1>Jamoani ro'yxatdan o'tkazish</h1>
            <p>Havas Futbol Ligasi - Yangi mavsum</p>
        </header>

        <!-- TEAM INFO SECTION -->
        <div class="section-card">
            <h2 class="section-title"><i data-lucide="flag"></i> Jamoa ma'lumotlari</h2>
            
            <div class="form-group">
                <label class="form-label" for="teamName">Jamoa nomi</label>
                <input type="text" id="teamName" class="form-control" placeholder="Masalan: Paxtakor" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="captainPhone">Sardor (Kapitan) telefoni</label>
                <div class="input-wrapper">
                    <span class="phone-prefix">+998</span>
                    <input type="tel" id="captainPhone" class="form-control" placeholder="90 123 45 67" maxlength="12" style="padding-left: 65px;" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Jamoa logotipi (1x1 format)</label>
                <div class="photo-upload" id="teamLogoDropzone">
                    <input type="file" id="teamLogoInput" accept="image/*" hidden>
                    <div id="teamLogoPlaceholder">
                        <i data-lucide="image-plus" style="width: 48px; height: 48px; color: var(--primary); margin-bottom: 15px;"></i>
                        <p>Logotipni yuklash uchun bosing</p>
                    </div>
                    <img id="teamLogoPreview" class="hidden" alt="Jamoa logotipi" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover;">
                </div>
            </div>
        </div>

        <!-- PLAYERS SECTION -->
        <div class="section-card">
            <h2 class="section-title">
                <i data-lucide="users"></i> O'yinchilar 
                <span id="playerCount" style="background: var(--primary); padding: 2px 10px; border-radius: 12px; font-size: 14px; margin-left: auto;">0 ta</span>
            </h2>
            
            <div class="player-list" id="playerList">
                <!-- Players will appear here -->
            </div>

            <button type="button" class="add-player-btn" id="openPlayerModalBtn">
                <i data-lucide="user-plus"></i> Yangi o'yinchi qo'shish
            </button>
        </div>

        <button type="button" class="submit-btn" id="submitTeamBtn">
            <span class="btn-text">Jamoani yuborish</span>
            <div class="loader hidden"></div>
        </button>
    </div>

    <!-- ADD PLAYER MODAL -->
    <div id="playerModal" class="modal hidden">
        <div class="modal-content">
            <button type="button" class="close-modal" id="closePlayerModalBtn"><i data-lucide="x"></i></button>
            <h2 style="margin-bottom: 20px;">O'yinchi qo'shish</h2>
            
            <form id="playerForm">
                <!-- Photo Upload -->
                <div class="form-group" style="margin-bottom: 30px;">
                    <label class="form-label">O'yinchi rasmi (1x1 format)</label>
                    <div class="photo-upload" id="playerPhotoDropzone" style="min-height: 150px; display: flex; align-items: center; justify-content: center;">
                        <input type="file" id="playerPhotoInput" accept="image/*" hidden>
                        <div id="playerPhotoPlaceholder">
                            <i data-lucide="camera" style="width: 32px; height: 32px; color: var(--primary); margin-bottom: 10px;"></i>
                            <p style="font-size: 12px;">Rasm yuklash</p>
                        </div>
                        <img id="playerPhotoPreview" class="hidden" alt="Rasm" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="playerFirstName">Ismi</label>
                    <input type="text" id="playerFirstName" class="form-control" placeholder="Masalan: Alisher" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="playerLastName">Familiyasi</label>
                    <input type="text" id="playerLastName" class="form-control" placeholder="Masalan: Usmonov" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="playerFatherName">Otasining ismi</label>
                    <input type="text" id="playerFatherName" class="form-control" placeholder="Masalan: Vali o'g'li" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Pasport seriyasi va raqami</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="playerPassportSeries" class="form-control" placeholder="AA" maxlength="2" style="width: 70px; text-transform: uppercase;" autocomplete="off" required>
                        <input type="tel" id="playerPassportNumber" class="form-control" placeholder="1234567" maxlength="7" pattern="[0-9]*" inputmode="numeric" style="flex: 1;" autocomplete="off" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="playerPhone">Telefoni</label>
                    <div class="phone-group">
                        <span class="phone-prefix">+998</span>
                        <input type="tel" id="playerPhone" class="form-control" placeholder="90 123 45 67" maxlength="12" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="playerComment">Izoh (Majburiy emas)</label>
                    <textarea id="playerComment" class="form-control" placeholder="Qo'shimcha ma'lumotlar..."></textarea>
                </div>
                
                <button type="submit" class="submit-btn" style="margin-top: 20px;">Qo'shish</button>
            </form>
        </div>
    </div>

    <!-- PROGRESS MODAL -->
    <div id="progressModal" class="modal hidden">
        <div class="modal-content" style="text-align: center;">
            <i data-lucide="cloud-upload" style="width: 64px; height: 64px; color: var(--primary); margin-bottom: 20px; margin: 0 auto;"></i>
            <h2>Ma'lumotlar yuklanmoqda...</h2>
            <p style="color: #94a3b8; margin-top: 10px;">Iltimos, sahifani yopmang!</p>
            
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0% (0/24 ta rasm)</div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script src="js/supabase.js"></script>
    <script src="js/team.js"></script>
</body>
</html>
