<!DOCTYPE html>
<html lang="uz" translate="no">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Havas Futbol Ligasi - Turnir Jadvali</title>
    <meta name="description" content="Havas Futbol Ligasining eng so'nggi turnir jadvali, to'purarlar ro'yxati va assistlar. O'z jamoangizni o'rnini tekshiring.">
    <meta name="keywords" content="turnir jadvali, havas liga jadval, futbol reyting, o'zbekiston havaskorlar ligasi, to'purarlar">
    <meta property="og:title" content="Havas Futbol Ligasi - Turnir Jadvali">
    <meta property="og:description" content="Havas Futbol Ligasi turnir jadvali va statistikalar.">
    <meta property="og:image" content="https://havasliga.uz/images/logo.png">
    <meta property="og:url" content="https://havasliga.uz/standings.html">
    <meta property="og:type" content="website">
    
    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" href="images/app-icon-rounded.png">
    <link rel="apple-touch-icon" href="images/app-icon-rounded.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HFL">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* Transparent Navbar with Blur for this page */
        .navbar::before {
            background: rgba(0, 0, 0, 0.1) !important;
            border-bottom: none !important;
            backdrop-filter: blur(25px) !important;
            -webkit-backdrop-filter: blur(25px) !important;
        }
        
        .standings-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .standings-container {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 600px) {
            .standings-container {
                padding: 0;
            }
            .glass-panel {
                padding: 15px !important;
            }
            .result-score {
                font-size: 16px !important;
            }
            .result-team-name {
                font-size: 13px !important;
                max-width: 70px !important;
            }
            .result-team img {
                width: 25px !important;
                height: 25px !important;
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--gold-primary);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--gold-glow);
            letter-spacing: 1px;
        }

        /* League Table Styles */
        .league-table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
        }
        .league-table th {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            padding: 12px 10px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--gold-primary);
        }
        .league-table th:nth-child(2) {
            text-align: left;
        }
        .league-table td {
            font-family: 'Inter', sans-serif;
            padding: 15px 10px;
            text-align: center;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 16px;
        }
        .league-table td:nth-child(2) {
            text-align: left;
        }
        .league-table tr:last-child td {
            border-bottom: none;
        }
        .league-table tbody tr {
            transition: background 0.2s;
        }
        .league-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        
        .team-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .team-logo-small {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
            background: #111;
        }
        .points {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold-primary);
        }

        /* Results Styles */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .result-team {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .result-team.away {
            flex-direction: row-reverse;
            text-align: right;
        }
        .result-team img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
        }
        .result-team-name {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }
        .result-score {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            padding: 0 10px;
            color: #fff;
            letter-spacing: 1px;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: center;
        }

        /* Stats Styles */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
        }
        .stats-table th {
            font-family: 'Outfit', sans-serif;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .stats-table th:first-child {
            text-align: left;
        }
        .stats-table td {
            padding: 12px 10px;
            font-weight: 600;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stats-table td:first-child {
            text-align: left;
        }
        .stats-player {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-player-name {
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            text-transform: uppercase;
        }
        .stats-value {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--gold-primary);
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            color: var(--gold-primary);
        }

        /* Custom League Select Styles */
        .header-with-filter {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            z-index: 100;
        }

        .custom-select-container {
            position: relative;
            min-width: 250px;
            font-family: 'Inter', sans-serif;
            z-index: 100;
        }

        .custom-select-trigger {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 15px;
            color: var(--gold-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .custom-select-trigger:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(240, 208, 96, 0.2);
        }

        .custom-select-options {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .custom-select-container.open .custom-select-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-option {
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px;
            font-weight: 500;
        }

        .custom-option:last-child {
            border-bottom: none;
        }

        .custom-option:hover {
            background: rgba(240, 208, 96, 0.1);
            color: var(--gold-primary);
        }

        .custom-option.active {
            background: rgba(240, 208, 96, 0.2);
            color: var(--gold-primary);
            font-weight: 700;
        }
    </style>
</head>
<body class="dark-theme">

    <!-- Background Elements -->
    <div class="particles" id="particles"></div>
    
    <!-- Dynamic League Backgrounds -->
    <div id="bgThemeSuper" class="league-bg-layer theme-super"></div>
    <div id="bgThemePro" class="league-bg-layer theme-pro"></div>
    <div id="bgTheme3liga" class="league-bg-layer theme-3liga"></div>
    <div id="bgThemeEuropa" class="league-bg-layer theme-europa"></div>
    <div id="bgThemeChampions" class="league-bg-layer theme-champions"></div>

    <div class="models-bg-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0;">
        <div class="model-wrap-1 slide-out">
            <model-viewer class="model-bg-1" src="assets/models/soccer_ball.glb" auto-rotate rotation-per-second="5deg" environment-image="neutral" exposure="1.1" camera-orbit="45deg 55deg 105%"></model-viewer>
        </div>
    </div>

    <!-- Main Content -->
    <div class="site-container" style="z-index: 1; position: relative; padding-top: 20px;">
        
        <div class="header-with-filter" style="display: flex; justify-content: center; align-items: center; margin-bottom: 30px; width: 100%;">
            <div style="display: flex; gap: 10px; flex-wrap: nowrap; justify-content: center; width: 100%; max-width: 400px;">
                <!-- Custom Select for League -->
                <div class="custom-select-container" id="leagueSelectContainer" style="flex: 1; min-width: 0;">
                    <div class="custom-select-trigger" id="leagueFilterTrigger" style="padding: 12px 15px;">
                        <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px;">Super liga</span>
                        <i data-lucide="chevron-down" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                    </div>
                    <div class="custom-select-options" id="leagueFilterOptions">
                        <div class="custom-option active" data-value="Super">Super liga</div>
                        <div class="custom-option" data-value="Pro">Pro liga</div>
                        <div class="custom-option" data-value="3-liga">3-liga</div>
                        <div class="custom-option" data-value="Europa">Europa ligasi</div>
                        <div class="custom-option" data-value="Chempion">Chempionlar ligasi</div>
                    </div>
                </div>

                <!-- Custom Select for Round (Tur) -->
                <div class="custom-select-container" id="roundSelectContainer" style="flex: 1; min-width: 0;">
                    <div class="custom-select-trigger" id="roundFilterTrigger" style="padding: 12px 15px;">
                        <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px;">Barcha turlar</span>
                        <i data-lucide="chevron-down" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                    </div>
                    <div class="custom-select-options" id="roundFilterOptions">
                        <div class="custom-option active" data-value="all">Barcha turlar</div>
                        <!-- Options are generated dynamically by JS based on the database -->
                    </div>
                </div>
            </div>
        </div>
        
        <div class="standings-container" id="contentContainer">
            <!-- Skeleton Left Column (Table) -->
            <div class="glass-panel" style="padding: 20px;">
                <div class="skeleton skeleton-title" style="margin: 0 auto 20px auto;"></div>
                <div style="margin-top: 10px;">
                    <div class="skeleton skeleton-text" style="height: 35px; margin-bottom: 15px;"></div>
                    <div class="skeleton skeleton-text" style="height: 45px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-text" style="height: 45px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-text" style="height: 45px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-text" style="height: 45px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-text" style="height: 45px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-text" style="height: 45px; margin-bottom: 10px;"></div>
                </div>
            </div>
            <!-- Skeleton Right Column -->
            <div style="display: flex; flex-direction: column; gap: 25px;">
                <!-- Results Skeleton -->
                <div class="glass-panel" style="padding: 20px;">
                    <div class="skeleton skeleton-title" style="width: 70%; margin: 0 auto 20px auto;"></div>
                    <div class="skeleton skeleton-box" style="height: 60px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-box" style="height: 60px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-box" style="height: 60px;"></div>
                </div>
                <!-- Scorers Skeleton -->
                <div class="glass-panel" style="padding: 20px;">
                    <div class="skeleton skeleton-title" style="width: 50%; margin: 0 auto 20px auto;"></div>
                    <div class="skeleton skeleton-text" style="height: 30px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-text" style="height: 30px; margin-bottom: 10px;"></div>
                    <div class="skeleton skeleton-text" style="height: 30px;"></div>
                </div>
            </div>
        </div>

    </div>

    <script src="js/layout.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/standings.js"></script>
</body>
</html>
