<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#080b10">
  <title>Transferlar — AMATORA</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/transfers.css">
  <script type="module" src="/js/transfers.mjs"></script>
</head>
<body class="transfer-page">
  <header class="topbar"><a class="brand" id="home-link" href="/index.html">AMATORA<span>JAMOA KABINETI</span></a><nav class="page-nav"><a href="/index.html">Bosh sahifa</a><a href="/kabinet.html">Kabinet</a></nav></header>
  <main>
    <div class="intro">
      <h1>Transferlar</h1>
      <p>O‘yinchini tanlang va transfer arizasini yuboring.</p>
    </div>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <section id="workspace" hidden>
      <div class="panel team-bar"><div><p class="eyebrow">SIZNING JAMOANGIZ</p><h2 id="team-name"></h2></div>
        <div class="team-actions"><span id="window-status" class="badge"></span></div></div>
      <div class="transfer-tabs" role="tablist" aria-label="Transfer bo‘limlari">
        <button id="search-tab" class="transfer-tab" type="button" role="tab" aria-selected="true" aria-controls="search-panel">O‘yinchi qidirish</button>
        <button id="history-tab" class="transfer-tab" type="button" role="tab" aria-selected="false" aria-controls="history-panel" tabindex="-1">Arizalarim</button>
      </div>
      <div class="workspace-grid">
        <section id="search-panel" class="panel search-panel" role="tabpanel" aria-labelledby="search-tab" tabindex="0">
          <label for="player-query">Ism yoki familiya</label>
          <input id="player-query" type="search" placeholder="O‘yinchini qidirish…" maxlength="80" autocomplete="off">
          <p id="search-status" class="muted" aria-live="polite"></p>
          <ul id="players" class="list"></ul>
          <button id="players-more" class="button quiet more" type="button" hidden>Yana ko'rsatish</button>
        </section>
        <section id="history-panel" class="panel history-panel" role="tabpanel" aria-labelledby="history-tab" tabindex="0" hidden>
          <div class="history-toolbar"><h2>Yuborilgan arizalar</h2><button id="refresh-history" class="button quiet refresh" type="button">↻ Yangilash</button></div>
          <p id="history-status" class="muted" aria-live="polite"></p>
          <ul id="history" class="list"></ul>
          <button id="history-more" class="button quiet more" type="button" hidden>Oldingi arizalar</button>
        </section>
      </div>
    </section>
    <dialog id="request-dialog" aria-labelledby="request-heading">
      <form id="request-form"><p class="eyebrow">YANGI TRANSFER ARIZASI</p><div class="request-player"><div id="selected-photo"></div><div><h2 id="request-heading"></h2><p id="selected-team" class="muted"></p></div></div>
        <label for="reason">Transfer sababi</label><textarea id="reason" rows="3" maxlength="1000" required placeholder="Nega bu o'yinchini jamoangizga olmoqchisiz?"></textarea>
        <div class="safety-note"><span>O‘yinchiga xabar boradi; transfer admin tasdiqlagach amalga oshadi.</span></div>
        <p id="request-error" class="error-text" role="alert" hidden></p>
        <div class="dialog-actions"><button id="cancel-request" type="button" class="button quiet">Bekor qilish</button><button id="send-request" type="submit" class="button primary">Ariza yuborish</button></div>
      </form>
    </dialog>
  </main>
  <footer>AMATORA · O'yin davom etadi.</footer>
</body>
</html>
