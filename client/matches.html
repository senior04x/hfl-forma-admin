<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Havas Futbol Ligasi - O'yinlar</title>
    <meta name="description" content="Havas Futbol Ligasi o'yinlar taqvimi va natijalari. Bugungi va oldingi qiziqarli matchlarni kuzatib boring.">
    <meta name="keywords" content="futbol o'yinlar, taqvim, havas liga natijalari, futbol matchlar">
    <meta property="og:title" content="Havas Futbol Ligasi - O'yinlar">
    <meta property="og:description" content="Havas Futbol Ligasi o'yinlar taqvimi va natijalari.">
    <meta property="og:image" content="https://havasliga.uz/images/logo.png">
    <meta property="og:url" content="https://havasliga.uz/matches.html">
    <meta property="og:type" content="website">
    
    <!-- Favicon & PWA -->
    <link rel="icon" type="image/jpeg" href="images/app-icon.jpg">
    <link rel="apple-touch-icon" href="images/app-icon.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HFL">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 20px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .filter-btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }
        .filter-btn.active {
            background: rgba(240, 208, 96, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            font-weight: 700;
            box-shadow: 0 0 15px var(--gold-glow);
        }
        
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.03); /* Removed solid background for glassmorphism */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            margin-top: 15px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px var(--gold-glow);
            border-color: var(--gold-primary);
        }

        .match-badges-container {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 2;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .badge-league { background: #111; color: var(--gold-primary); border: 1px solid var(--gold-primary); }
        .badge-scheduled { background: #2d3748; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.2); }
        .badge-live { background: var(--error); color: white; animation: pulse 2s infinite; border: 1px solid #ff7b7b; }
        .badge-finished { background: var(--success); color: white; border: 1px solid #34d399; }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .team-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
            border: 2px solid var(--glass-border);
            padding: 5px;
        }
        .team-name {
            font-weight: 700;
            font-size: 15px;
            text-align: center;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
        }
        .match-score {
            font-size: 32px;
            font-weight: 800;
            color: var(--gold-primary);
            padding: 0 15px;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 0 10px var(--gold-glow);
        }
        .match-vs {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-muted);
            padding: 0 15px;
        }

        .match-details {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .btn-live {
            background: rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ff7b7b;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            margin-top: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            cursor: pointer;
        }
        .btn-live:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
            color: white;
        }

        /* Match Details Modal */
        .match-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .match-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .match-modal {
            background: var(--bg-dark);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            border: 1px solid var(--gold-primary);
            box-shadow: 0 0 30px var(--gold-glow);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            transform: translateY(20px);
            transition: all 0.3s;
        }
        .match-modal-overlay.active .match-modal {
            transform: translateY(0);
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-family: 'Outfit', sans-serif; color: var(--gold-primary); font-size: 20px; margin: 0; }
        .close-modal { background: none; border: none; color: white; cursor: pointer; }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }
        
        .timeline {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .timeline-event {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 10px;
        }
        .timeline-minute {
            font-weight: 800;
            color: var(--gold-primary);
            font-size: 14px;
            width: 25px;
        }
        
        .skeleton {
            animation: skeleton-loading 1.5s infinite linear;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            border-radius: 4px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .timeline-icon { font-size: 18px; }
        .timeline-details {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .timeline-player { font-weight: 600; font-size: 14px; }
        .timeline-team { font-size: 12px; color: var(--text-muted); }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { opacity: 0.8; box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body>
    
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>

    <div class="site-container">
        <h1 style="text-align: center; margin-bottom: 30px; font-family: 'Outfit', sans-serif; color: var(--gold-primary); text-shadow: 0 2px 10px var(--gold-glow);">O'yinlar Jadvali</h1>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Barchasi</button>
            <button class="filter-btn" data-filter="scheduled">Rejalashtirilgan</button>
            <button class="filter-btn" data-filter="live">Jonli (Live)</button>
            <button class="filter-btn" data-filter="finished">Yakunlangan</button>
        </div>

        <!-- Loading State -->
        <div id="loadingMatches" class="matches-grid">
            <script>
                for(let i=0; i<6; i++) {
                    document.write(`
                        <div class="match-card" style="cursor: default; pointer-events: none;">
                            <div class="match-badges-container">
                                <div class="badge skeleton" style="width: 80px; height: 24px; border: none; box-shadow: none;"></div>
                                <div class="badge skeleton" style="width: 100px; height: 24px; border: none; box-shadow: none;"></div>
                            </div>
                            
                            <div class="match-teams">
                                <div class="team">
                                    <div class="team-logo skeleton" style="border: none;"></div>
                                    <div class="team-name skeleton" style="width: 80px; height: 18px; border-radius: 4px; margin-top: 5px;"></div>
                                </div>
                                <div class="match-score skeleton" style="width: 70px; height: 35px; border-radius: 6px;"></div>
                                <div class="team">
                                    <div class="team-logo skeleton" style="border: none;"></div>
                                    <div class="team-name skeleton" style="width: 80px; height: 18px; border-radius: 4px; margin-top: 5px;"></div>
                                </div>
                            </div>

                            <div class="match-details" style="gap: 12px;">
                                <div class="detail-row">
                                    <div class="skeleton" style="width: 14px; height: 14px; border-radius: 3px;"></div>
                                    <div class="skeleton" style="width: 120px; height: 14px; border-radius: 3px;"></div>
                                </div>
                                <div class="detail-row">
                                    <div class="skeleton" style="width: 14px; height: 14px; border-radius: 3px;"></div>
                                    <div class="skeleton" style="width: 80px; height: 14px; border-radius: 3px;"></div>
                                </div>
                                <div class="detail-row">
                                    <div class="skeleton" style="width: 14px; height: 14px; border-radius: 3px;"></div>
                                    <div class="skeleton" style="width: 160px; height: 14px; border-radius: 3px;"></div>
                                </div>
                            </div>
                            
                            <div class="btn-live skeleton" style="width: 100%; height: 42px; border: none; color: transparent; margin-top: auto; border-radius: 8px;"></div>
                        </div>
                    `);
                }
            </script>
        </div>

        <div id="matchesGrid" class="matches-grid hidden">
            <!-- Matches will be injected here -->
        </div>
    </div>

    <!-- Match Details Modal -->
    <div class="match-modal-overlay" id="matchModal">
        <div class="match-modal" onClick="event.stopPropagation()">
            <div class="modal-header">
                <h2>O'yin Tafsilotlari</h2>
                <button class="close-modal" id="closeModalBtn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="match-teams" id="modalTeams">
                    <!-- Teams and score injected here -->
                </div>
                <div class="match-details" id="modalDetails" style="margin-top: 20px;">
                    <!-- Details injected here -->
                </div>
                
                <h3 style="margin-top: 25px; margin-bottom: 10px; font-family: 'Outfit'; color: var(--text-muted); font-size: 16px;">O'yin Voqealari</h3>
                <div class="timeline" id="modalTimeline">
                    <!-- Timeline injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>lucide.createIcons();</script>
    <script src="js/layout.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/matches-public.js"></script>
</body>
</html>
