<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Havas Futbol Ligasi - Zayavka Qoldirish</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Registration Form -->
        <main class="form-container">
            <form id="registrationForm">
                
                <div class="top-section">
                    <!-- Photo Upload -->
                    <div class="form-group photo-upload-group">
                        <label class="form-label">
                            <i data-lucide="camera" class="label-icon"></i> 1x1 Rasm
                        </label>
                        <div class="photo-dropzone" id="photoDropzone">
                            <div class="photo-placeholder" id="photoPlaceholder">
                                <i data-lucide="image-plus" class="upload-icon" style="margin-bottom: 5px;"></i>
                                <span class="upload-text" style="font-size: 13px;">Yuklash</span>
                            </div>
                            <img id="photoPreview" class="photo-preview hidden" alt="Rasm preview">
                            <input type="file" id="photoInput" accept="image/jpeg, image/png, image/webp" required class="hidden-input">
                        </div>
                    </div>

                    <!-- Logo -->
                    <div class="logo-group">
                        <div style="display: flex; flex-direction: column; align-items: center;">
                            <img src="images/logo.png" alt="Havas Futbol Ligasi Logo" class="logo">
                            <p style="font-size: 9px; color: #64748b; margin-top: -5px; text-align: center; line-height: 1.3; max-width: 120px;">
                                Barcha ma'lumotlaringiz xavfsiz tarzda adminga yo'naltiriladi <i data-lucide="shield-check" style="width: 10px; height: 10px; vertical-align: middle;"></i>
                            </p>
                        </div>
                    </div>
                </div>

            <!-- First Name -->
            <div class="form-group">
                <label class="form-label" for="firstName">
                    <i data-lucide="user" class="label-icon"></i> Ismingiz
                </label>
                <div class="input-wrapper">
                    <input type="text" id="firstName" class="form-control" placeholder="Masalan: Alisher" required>
                </div>
            </div>

            <!-- Last Name -->
            <div class="form-group">
                <label class="form-label" for="lastName">
                    <i data-lucide="user" class="label-icon"></i> Familiyangiz
                </label>
                <div class="input-wrapper">
                    <input type="text" id="lastName" class="form-control" placeholder="Masalan: Karimov" required>
                </div>
            </div>

            <!-- Father Name -->
            <div class="form-group">
                <label class="form-label" for="fatherName">
                    <i data-lucide="users" class="label-icon"></i> Otangizning ismi
                </label>
                <div class="input-wrapper">
                    <input type="text" id="fatherName" class="form-control" placeholder="Masalan: Bahodirovich" required>
                </div>
            </div>

            <!-- Passport -->
            <div class="form-group">
                <label class="form-label">
                    <i data-lucide="credit-card" class="label-icon"></i> Pasport seriya va raqami
                </label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="passportSeries" class="form-control" placeholder="AA" maxlength="2" style="width: 80px; text-transform: uppercase;" autocomplete="off" required>
                    <input type="tel" id="passportNumber" class="form-control" placeholder="1234567" maxlength="7" pattern="[0-9]*" inputmode="numeric" style="flex: 1;" autocomplete="off" required>
                </div>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label class="form-label" for="phone">
                    <i data-lucide="phone" class="label-icon"></i> Telefon raqamingiz
                </label>
                <div class="phone-group">
                    <span class="phone-prefix">+998</span>
                    <input type="tel" id="phone" class="form-control" placeholder="90 123 45 67" maxlength="12" required>
                </div>
            </div>

            <!-- Comment / Experience -->
            <div class="form-group">
                <label class="form-label" for="comment">
                    <i data-lucide="message-square-text" class="label-icon"></i> Izoh (Muhim)
                </label>
                <textarea id="comment" class="form-control textarea" rows="4" placeholder="Avval qayerda o'ynaganingiz va qaysi komandada o'ynamoqchisiz shu haqida batafsil yozing..." required></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text">
                    <i data-lucide="check-circle-2" class="btn-icon"></i> YUBORISH
                </span>
                <span class="loader hidden"></span>
            </button>
        </form>

        <!-- Success Modal -->
        <div id="successModal" class="modal hidden">
            <div class="modal-content">
                <div class="success-icon">
                    <i data-lucide="party-popper" size="64"></i>
                </div>
                <h2>Zayavkangiz qabul qilindi!</h2>
                <p>Zayavkangiz holatini tekshirish uchun quyidagi tugmani bosib, Telegram botimizga o'ting.</p>
                <a href="#" id="telegramBotBtn" class="telegram-btn">
                    <i data-lucide="send" class="btn-icon"></i>
                    Botga o'tish
                </a>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
