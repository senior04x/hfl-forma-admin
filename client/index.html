    <style>
        /* Top Scorers Banner Slider Styles */
        .top-scorers-slider-section {
            margin: 20px -15px 35px -15px;
            width: calc(100% + 30px);
            max-width: calc(100% + 30px);
            padding: 0;
            overflow: hidden;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 0 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .slider-wrapper {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 10px 0 25px 0;
        }

        .slider-track {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            gap: 16px;
            width: 100%;
        }

        .top-scorer-slide {
            flex: 0 0 82%;
            min-width: 82%;
            aspect-ratio: 1.85 / 1;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 22px 30px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0.55;
            transform: scale(0.93);
        }

        .top-scorer-slide.active-slide {
            opacity: 1;
            transform: scale(1);
        }

        /* League Themes with glassmorphism translucent gradient backdrops matching league branding */
        .top-scorer-slide.theme-super {
            background: linear-gradient(135deg, rgba(122, 10, 4, 0.45) 0%, rgba(187, 19, 8, 0.45) 50%, rgba(247, 132, 43, 0.35) 100%);
        }
        .top-scorer-slide.theme-pro {
            background: linear-gradient(135deg, rgba(0, 39, 102, 0.45) 0%, rgba(0, 62, 157, 0.45) 50%, rgba(0, 186, 239, 0.35) 100%);
        }
        .top-scorer-slide.theme-3liga {
            background: linear-gradient(135deg, rgba(92, 0, 119, 0.45) 0%, rgba(162, 0, 210, 0.45) 50%, rgba(235, 0, 244, 0.35) 100%);
        }
        .top-scorer-slide.theme-7x7 {
            background: linear-gradient(135deg, rgba(1, 34, 76, 0.45) 0%, rgba(1, 60, 130, 0.45) 50%, rgba(88, 154, 251, 0.35) 100%);
        }

        .slide-badge-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            z-index: 2;
        }
        .slide-league-logo {
            height: 45px;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
        }
        .league-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .slide-content {
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }

        .slide-info {
            flex: 1;
            max-width: 600px;
            text-align: left;
        }

        /* Skeleton Loading Shimmer Effect */
        .skeleton-pulse {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.08) 25%, rgba(255, 255, 255, 0.22) 37%, rgba(255, 255, 255, 0.08) 63%);
            background-size: 400% 100%;
            animation: skeleton-shimmer 1.4s ease infinite;
            border-radius: 8px;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        .skeleton-text-name {
            width: 70%;
            height: 24px;
            margin-bottom: 8px;
            border-radius: 6px;
        }

        .skeleton-text-team {

            height: 16px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .skeleton-text-badge {

            height: 26px;
            border-radius: 10px;
        }

        .player-framed-card.skeleton-card {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .slide-silhouette-container {
            position: relative;
            width: 140px;
            height: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .silhouette-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,230,0,0.6) 0%, rgba(255,255,255,0) 70%);
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        .silhouette-box {
            position: relative;
            width: 110px;
            height: 150px;
            background: rgba(10, 10, 20, 0.4);
            backdrop-filter: blur(15px);
            border: 2px dashed rgba(255, 230, 0, 0.6);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .silhouette-svg {
            width: 80px;
            height: 80px;
            color: rgba(255,255,255,0.25);
        }

        .question-mark-overlay {
            position: absolute;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 50px;
            color: #FFE600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.8), 0 4px 8px rgba(0,0,0,0.8);
            animation: float-qmark 2s infinite ease-in-out;
        }

        @keyframes float-qmark {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Slider Nav Buttons */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }
        .slider-btn:hover {
            background: rgba(240, 208, 96, 0.8);
            color: black;
            box-shadow: 0 0 15px rgba(240, 208, 96, 0.6);
        }
        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        /* Slider Dots */
        .slider-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dot.active {
            width: 28px;
            border-radius: 10px;
            background: #FFE600;
            box-shadow: 0 0 10px rgba(255,230,0,0.8);
        }

        @media (max-width: 768px) {
            .top-scorers-slider-section {
                margin: 10px -15px 20px -15px;
                width: calc(100% + 30px);
                max-width: calc(100% + 30px);
                padding: 0;
                overflow: hidden;
            }
            .slider-wrapper {
                padding: 5px 0 18px 0;
            }
            .slider-track {
                gap: 10px;
            }
            .top-scorer-slide {
                flex: 0 0 84%;

            .question-mark-overlay {

            }
            .slider-btn {
                display: none !important;
            }
            .prev-btn { left: 6px; }
            .next-btn { right: 6px; }
            .slider-dots {
                bottom: 6px;
            }
            .dot {
                width: 6px;
                height: 6px;
            }
            .dot.active {
                width: 18px;
            }
        }

        /* 2x2 Quick Navigation Cards Grid */
        .quick-nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin: 25px auto 45px auto;
            max-width: 650px;
            padding: 0 15px;
        }

        .nav-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            background: rgba(18, 20, 29, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            color: #E2E8F0;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .nav-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 230, 0, 0.5);
            box-shadow: 0 12px 30px rgba(255, 230, 0, 0.2);
            color: white;

        .nav-card.card-primary {
            background: linear-gradient(135deg, rgba(247, 183, 49, 0.88) 0%, rgba(220, 140, 15, 0.95) 100%);
            color: #0A0D14;
            border: 1px solid rgba(255, 230, 0, 0.7);
            box-shadow: 0 10px 30px rgba(247, 183, 49, 0.35);
        }

        .nav-card.card-primary:hover {
            box-shadow: 0 14px 35px rgba(247, 183, 49, 0.55);
            transform: translateY(-3px) scale(1.02);
        }

        .nav-card-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .nav-card.card-primary .nav-card-icon {
            background: rgba(0, 0, 0, 0.15);
        }

        .nav-card-icon svg {
            width: 20px;
            height: 20px;
        }

        .nav-card-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.2;
            letter-spacing: 0.3px;
        }

        .top-scorer-crown-badge {

    <script>
        lucide.createIcons();
        
        // 3D Models Entrance Animation
        document.addEventListener('DOMContentLoaded', () => {
            const showModels = () => {
                const w1 = document.querySelector('.model-wrap-1');
                const w2 = document.querySelector('.model-wrap-2');
                const w3 = document.querySelector('.model-wrap-3');

            }, { once: true });
            
            // Fallback just in case
            setTimeout(showModels, 4500);
        });

        // 3D Models Exit Animation
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('a');
            links.forEach(link => {
                // Only animate for internal links
                if (link.hostname === window.location.hostname && link.target !== '_blank' && !link.href.includes('tel:')) {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetUrl = link.href;
                        
                        // Add slide out class to wrappers instead of model-viewers directly
                        const w1 = document.querySelector('.model-wrap-1');
                        const w2 = document.querySelector('.model-wrap-2');
                        const w3 = document.querySelector('.model-wrap-3');
                        
                        if(w1) w1.classList.add('slide-out');
                        if(w2) w2.classList.add('slide-out');
                        if(w3) w3.classList.add('slide-out');
                        
                        // Wait for animation then navigate
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 500);
                    });
                }
            });
        });

        // Top Scorers Slider Infinite Seamless Loop Logic
        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('sliderTrack');
            const dots = document.querySelectorAll('.slider-dots .dot');
            const prevBtn = document.getElementById('prevSlideBtn');
            const nextBtn = document.getElementById('nextSlideBtn');

            if (!track || dots.length === 0) return;

            const originalSlides = Array.from(track.querySelectorAll('.top-scorer-slide'));
            const realTotal = originalSlides.length;
            if (realTotal === 0) return;

            // Clone slides for seamless infinite loop:
            // Append first slide to end, prepend last slide to start
            const firstClone = originalSlides[0].cloneNode(true);
            const lastClone = originalSlides[realTotal - 1].cloneNode(true);

            firstClone.classList.add('clone-slide');
            lastClone.classList.add('clone-slide');

            track.appendChild(firstClone);
            track.insertBefore(lastClone, originalSlides[0]);

            const allSlides = Array.from(track.querySelectorAll('.top-scorer-slide'));
            let currentVirtualIndex = 1; // Start at first REAL slide (index 1 in virtual array)
            let isTransitioning = false;

            const updateSlidePosition = (animate = true) => {
                if (animate) {
                    track.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                } else {
                    track.style.transition = 'none';
                }

                const isMobile = window.innerWidth <= 768;
                const slideWidthPercent = isMobile ? 84 : 82;
                const gapPx = isMobile ? 10 : 16;
                const centerOffsetPercent = (100 - slideWidthPercent) / 2;

                track.style.transform = `translateX(calc(${centerOffsetPercent}% - ${currentVirtualIndex} * (${slideWidthPercent}% + ${gapPx}px)))`;

                // Real active index (0 to realTotal - 1)
                let realIndex = (currentVirtualIndex - 1 + realTotal) % realTotal;

                dots.forEach((dot, idx) => {
                    dot.classList.toggle('active', idx === realIndex);
                });

                allSlides.forEach((slide, idx) => {
                    slide.classList.toggle('active-slide', idx === currentVirtualIndex);
                });
            };

            // Set initial position without animation
            updateSlidePosition(false);

            const handleNext = () => {
                if (isTransitioning) return;
                isTransitioning = true;
                currentVirtualIndex++;
                updateSlidePosition(true);
            };

            const handlePrev = () => {
                if (isTransitioning) return;
                isTransitioning = true;
                currentVirtualIndex--;
                updateSlidePosition(true);
            };

            track.addEventListener('transitionend', () => {
                isTransitioning = false;

                // If moved past the last real slide (to firstClone)
                if (currentVirtualIndex >= realTotal + 1) {
                    currentVirtualIndex = 1;
                    updateSlidePosition(false);
                }
                // If moved before the first real slide (to lastClone)
                if (currentVirtualIndex <= 0) {
                    currentVirtualIndex = realTotal;
                    updateSlidePosition(false);
                }
            });

            let slideInterval;
            const startAutoSlide = () => {
                stopAutoSlide();
                slideInterval = setInterval(handleNext, 4500);
            };

            const stopAutoSlide = () => {
                if (slideInterval) clearInterval(slideInterval);
            };

            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    handlePrev();
                    startAutoSlide();
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    handleNext();
                    startAutoSlide();
                });
            }

            dots.forEach((dot) => {
                dot.addEventListener('click', (e) => {
                    if (isTransitioning) return;
                    const idx = parseInt(e.target.dataset.index);
                    currentVirtualIndex = idx + 1;
                    updateSlidePosition(true);
                    startAutoSlide();
                });
            });

            // Touch Swipe Events
            const sliderContainer = document.getElementById('topScorersSlider');
            if (sliderContainer) {
                sliderContainer.addEventListener('mouseenter', stopAutoSlide);
                sliderContainer.addEventListener('mouseleave', startAutoSlide);

                let touchStartX = 0;
                let touchEndX = 0;

                sliderContainer.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                sliderContainer.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    const diffX = touchStartX - touchEndX;
                    if (Math.abs(diffX) > 35) {
                        if (diffX > 0) {
                            handleNext();
                        } else {
                            handlePrev();
                        }
                        startAutoSlide();
                    }
                }, { passive: true });
            }

            startAutoSlide();

            window.addEventListener('resize', () => {
                updateSlidePosition(false);
            });
        });

        // Fetch and display latest finished matches on homepage
        document.addEventListener('DOMContentLoaded', async () => {
            const resultsContainer = document.getElementById('homepageRecentResults');
            if (!resultsContainer || typeof db === 'undefined') return;

            try {
                // Fetch finished matches
                const { data: matches, error: matchesErr } = await db
                    .from('matches')
                    .select('*')
                    .eq('status', 'finished')
                    .order('match_date', { ascending: false })

                if (matchesErr || !matches || matches.length === 0) return;

                // Fetch Teams
                const { data: teams, error: teamsErr } = await db
                    .from('teams')
                    .select('id, name, logo_url');

                if (teamsErr || !teams) return;

                const teamsMap = {};
                teams.forEach(t => { teamsMap[t.id] = t; });

                let html = '';
                matches.forEach(m => {
                    const homeTeam = teamsMap[m.home_team_id] || { name: 'Jamoa A', logo_url: '' };
                    const awayTeam = teamsMap[m.away_team_id] || { name: 'Jamoa B', logo_url: '' };

                    const leagueText = m.league || 'Liga';
                    const roundText = m.round ? `${m.round}-tur` : '';

                    html += `
                        <div class="result-card">
                            <div class="result-card-badge">
                                <span class="result-league-name">${leagueText}</span>
                                <span>${roundText}</span>
                            </div>
                            <div class="result-card-body">
                                <div class="result-team-box">
                                    <img src="${homeTeam.logo_url}" alt="" class="result-team-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/32x32?text=${homeTeam.name.charAt(0)}'">
                                    <span class="result-team-name">${homeTeam.name}</span>
                                </div>
                                <div class="result-score-box">${m.home_score} - ${m.away_score}</div>
                                <div class="result-team-box away">
                                    <span class="result-team-name">${awayTeam.name}</span>
                                    <img src="${awayTeam.logo_url}" alt="" class="result-team-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/32x32?text=${awayTeam.name.charAt(0)}'">
                                </div>
                            </div>
                        </div>
                    `;
                });

                resultsContainer.innerHTML = html;
                lucide.createIcons();
            } catch (err) {
                console.log('Homepage recent results fetch:', err);
            }
        });

        // Automatic canvas background remover for player photos
        function processPlayerCutout(imgElement) {
            if (!imgElement || !imgElement.complete) return;
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = imgElement.naturalWidth || imgElement.width;
                canvas.height = imgElement.naturalHeight || imgElement.height;
                ctx.drawImage(imgElement, 0, 0);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                const bgR = data[0];
                const bgG = data[1];
                const bgB = data[2];

                const threshold = 35;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    const diff = Math.sqrt(
                        Math.pow(r - bgR, 2) +
                        Math.pow(g - bgG, 2) +
                        Math.pow(b - bgB, 2)
                    );

                    if (diff < threshold || (r > 240 && g > 240 && b > 240) || (r < 15 && g < 15 && b < 15 && i < data.length * 0.1)) {
                        data[i + 3] = 0; // Transparent
                    }
                }

                ctx.putImageData(imgData, 0, 0);
                imgElement.src = canvas.toDataURL('image/png');
            } catch (e) {
                // Cross-Origin or CORS fallback
            }
        }

        // Fetch Real Top Scorers for Slider dynamically from Supabase
        async function loadRealTopScorersForSlider() {
            if (typeof db === 'undefined') return;

            try {
                // 1. Fetch all goal/assist events
                const { data: events, error: eErr } = await db
                    .from('match_events')
                    .select('id, event_type, player_id, team_id')
                    .in('event_type', ['goal', 'assist']);

                if (eErr || !events || events.length === 0) return;

                // 2. Fetch all players/applications
                const { data: players } = await db
                    .from('applications')
                    .select('id, first_name, last_name, photo_url, team_id');

                const playersMap = {};
                if (players && players.length > 0) {
                    players.forEach(p => { playersMap[p.id] = p; });
                }

                // 3. Fetch all teams
                const { data: teams } = await db
                    .from('teams')
                    .select('id, name, logo_url, league');

                const teamsMap = {};
                if (teams && teams.length > 0) {
                    teams.forEach(t => { teamsMap[t.id] = t; });
                }

                function getLeagueKey(leagueStr) {
                    if (!leagueStr) return '';
                    const l = String(leagueStr).toLowerCase().trim();
                    if (l.includes('super')) return 'Super liga';
                    if (l.includes('pro')) return 'Pro liga';
                    if (l.includes('3')) return '3-liga';
                    if (l.includes('7x7') || l.includes('7')) return '7x7 liga';
                    return l;
                }

                const playerStatsByLeague = {};

                events.forEach(e => {
                    if (!e.player_id) return;
                    const player = playersMap[e.player_id];
                    const team = teamsMap[e.team_id || (player ? player.team_id : null)];
                    
                    const leagueStr = team ? team.league : '';
                    const leagueKey = getLeagueKey(leagueStr);
                    if (!leagueKey) return;

                    if (!playerStatsByLeague[leagueKey]) {
                        playerStatsByLeague[leagueKey] = {};
                    }

                    const leagueMap = playerStatsByLeague[leagueKey];
                    if (!leagueMap[e.player_id]) {
                        leagueMap[e.player_id] = {
                            id: e.player_id,
                            firstName: player ? (player.first_name || '') : 'Futbolchi',
                            lastName: player ? (player.last_name || '') : '',
                            photoUrl: player ? (player.photo_url || '') : '',
                            teamName: team ? (team.name || '') : '',
                            teamLogo: team ? (team.logo_url || '') : '',
                            goals: 0,
                            assists: 0
                        };
                    }

                    if (e.event_type === 'goal') leagueMap[e.player_id].goals += 1;
                    if (e.event_type === 'assist') leagueMap[e.player_id].assists += 1;
                });

                const leagueTopScorers = {};
                Object.keys(playerStatsByLeague).forEach(lKey => {
                    const topScorers = Object.values(playerStatsByLeague[lKey])
                        .filter(p => p.goals > 0)
                        .sort((a, b) => b.goals - a.goals);

                    if (topScorers.length > 0) {
                        leagueTopScorers[lKey] = topScorers[0];
                    }
                });

                // Update Slider Slides if top scorers exist
                const slides = document.querySelectorAll('.top-scorer-slide');
                slides.forEach(slide => {
                    const themeClass = Array.from(slide.classList).find(c => c.startsWith('theme-'));
                    let leagueName = '';
                    if (themeClass === 'theme-super') leagueName = 'Super liga';
                    if (themeClass === 'theme-pro') leagueName = 'Pro liga';
                    if (themeClass === 'theme-3liga') leagueName = '3-liga';
                    if (themeClass === 'theme-7x7') leagueName = '7x7 liga';

                    const topPlayer = leagueTopScorers[leagueName];
                    const contentBox = slide.querySelector('.slide-content');
                    if (contentBox) {
                        if (topPlayer) {
                            const pName = `${topPlayer.firstName} ${topPlayer.lastName}`.trim();
                            const pPhoto = topPlayer.photoUrl || 'images/app-icon-rounded.png';
                            const tLogo = topPlayer.teamLogo || 'images/logo.png';
                            const tName = topPlayer.teamName || '';

                            contentBox.innerHTML = `
                                <div class="slide-info">
                                    <h3 class="player-real-name">${pName}</h3>
                                    <div class="player-team-info">
                                        <img src="${tLogo}" alt="${tName}" class="player-team-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/22x22?text=T'">
                                        <span>${tName}</span>
                                    </div>
                                    <div class="player-stats-row">
                                        <span class="stat-badge goals-badge">
                                            <i data-lucide="target" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 3px;"></i> ${topPlayer.goals} ta gol
                                        </span>
                                        ${topPlayer.assists > 0 ? `<span class="stat-badge assists-badge"><i data-lucide="footprints" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 3px;"></i> ${topPlayer.assists} ta uzatma</span>` : ''}
                                    </div>
                                </div>
                                <div class="slide-player-cutout-container">
                                    <div class="player-frame-glow"></div>
                                    <div class="player-framed-card">
                                        <img src="${pPhoto}" alt="${pName}" class="player-frame-img" onerror="this.onerror=null; this.src='images/app-icon-rounded.png'">
                                    </div>
                                </div>
                            `;

                            const headerBox = slide.querySelector('.slide-badge-header');
                            if (headerBox) {
                                const oldBadge = headerBox.querySelector('.top-scorer-crown-badge');
                                if (oldBadge) oldBadge.remove();
                                headerBox.innerHTML += `<span class="top-scorer-crown-badge">1-tur</span>`;
                            }
                        } else {
                            contentBox.innerHTML = `
                                <div class="slide-info">
                                    <h3 class="question-title">${leagueName} 1-tur to'purari kim bo'lishi mumkin?</h3>
                                </div>
                                <div class="slide-silhouette-container">
                                    <div class="silhouette-glow"></div>
                                    <div class="silhouette-box">
                                        <svg viewBox="0 0 24 24" fill="currentColor" class="silhouette-svg">
                                            <path d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a7 7 0 0 0-7 7v1h14v-1a7 7 0 0 0-7-7z"/>
                                        </svg>
                                        <div class="question-mark-overlay">?</div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                });

                if (typeof lucide !== 'undefined') lucide.createIcons();
            } catch (err) {
                console.error('Real top scorers slider fetch:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadRealTopScorersForSlider);
    </script>
    <script src="js/layout.js"></script>
    <script src="js/welcome.js"></script>
    <script src="js/main.js"></script>
    <script src="js/3d-scene.js"></script>
</body>
</html>
