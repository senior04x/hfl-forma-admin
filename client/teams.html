<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Havas Futbol Ligasi - Jamoalar</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>

    <div class="site-container">
        <h1 style="text-align: center; margin-bottom: 40px; font-family: 'Outfit', sans-serif;">Tasdiqlangan Jamoalar</h1>
        
        <div id="loadingTeams" class="teams-grid">
            <!-- Skeleton 1 -->
            <div class="team-card-public skeleton-card">
                <div class="skeleton-circle" style="width: 100px; height: 100px; min-width: 100px; min-height: 100px; border-radius: 50%; margin: 0 auto 15px auto; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1);"></div>
                <div class="skeleton-line" style="width: 120px; height: 20px; margin: 0 auto 8px auto;"></div>
                <div class="skeleton-line" style="width: 80px; height: 14px; margin: 0 auto;"></div>
            </div>
            <!-- Skeleton 2 -->
            <div class="team-card-public skeleton-card">
                <div class="skeleton-circle" style="width: 100px; height: 100px; min-width: 100px; min-height: 100px; border-radius: 50%; margin: 0 auto 15px auto; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1);"></div>
                <div class="skeleton-line" style="width: 120px; height: 20px; margin: 0 auto 8px auto;"></div>
                <div class="skeleton-line" style="width: 80px; height: 14px; margin: 0 auto;"></div>
            </div>
            <!-- Skeleton 3 -->
            <div class="team-card-public skeleton-card">
                <div class="skeleton-circle" style="width: 100px; height: 100px; min-width: 100px; min-height: 100px; border-radius: 50%; margin: 0 auto 15px auto; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1);"></div>
                <div class="skeleton-line" style="width: 120px; height: 20px; margin: 0 auto 8px auto;"></div>
                <div class="skeleton-line" style="width: 80px; height: 14px; margin: 0 auto;"></div>
            </div>
            <!-- Skeleton 4 -->
            <div class="team-card-public skeleton-card hide-mobile">
                <div class="skeleton-circle" style="width: 100px; height: 100px; min-width: 100px; min-height: 100px; border-radius: 50%; margin: 0 auto 15px auto; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1);"></div>
                <div class="skeleton-line" style="width: 120px; height: 20px; margin: 0 auto 8px auto;"></div>
                <div class="skeleton-line" style="width: 80px; height: 14px; margin: 0 auto;"></div>
            </div>
        </div>

        <div id="teamsGrid" class="teams-grid hidden">
            <!-- Teams will be injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script>lucide.createIcons();</script>
    <script src="js/layout.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/teams-public.js"></script>
</body>
</html>
