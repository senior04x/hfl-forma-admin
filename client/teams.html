<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Havas Futbol Ligasi - Jamoalar</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>

    <div class="site-container">
        <h1 style="text-align: center; margin-bottom: 40px; font-family: 'Outfit', sans-serif;">Tasdiqlangan Jamoalar</h1>
        
        <div id="loadingTeams" style="text-align: center; padding: 40px;">
            <i data-lucide="loader" class="spin" style="width: 40px; height: 40px; color: var(--gold-primary);"></i>
            <p style="margin-top: 15px; color: var(--text-muted);">Jamoalar yuklanmoqda...</p>
        </div>

        <div id="teamsGrid" class="teams-grid hidden">
            <!-- Teams will be injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script>lucide.createIcons();</script>
    <script src="js/layout.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/teams-public.js"></script>
</body>
</html>
