<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Havas Futbol Ligasi - Jamoalar</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .header-with-filter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .custom-select-container {
            position: relative;
            min-width: 220px;
            font-family: 'Inter', sans-serif;
            z-index: 100;
        }

        .custom-select-trigger {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 15px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .custom-select-trigger:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(240, 208, 96, 0.2);
        }

        .custom-select-options {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .custom-select-container.open .custom-select-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-option {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }

        .custom-option:last-child {
            border-bottom: none;
        }

        .custom-option:hover {
            background: rgba(240, 208, 96, 0.1);
            color: var(--gold-primary);
        }

        .custom-option.active {
            background: rgba(240, 208, 96, 0.2);
            color: var(--gold-primary);
            font-weight: 700;
        }
    </style>
</head>
<body>
    
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>

    <div class="site-container">
        <div class="header-with-filter">
            <h1 style="margin: 0; font-family: 'Outfit', sans-serif;">Jamoalar</h1>
            
            <div class="custom-select-container" id="leagueSelectContainer">
                <div class="custom-select-trigger" id="leagueFilterTrigger">
                    <span>Barcha ligalar</span>
                    <i data-lucide="chevron-down" style="width: 16px; height: 16px;"></i>
                </div>
                <div class="custom-select-options" id="leagueFilterOptions">
                    <div class="custom-option active" data-value="all">Barcha ligalar</div>
                    <div class="custom-option" data-value="Super liga">Super liga</div>
                    <div class="custom-option" data-value="Pro liga">Pro liga</div>
                    <div class="custom-option" data-value="3-liga">3-liga</div>
                    <div class="custom-option" data-value="Europa">Europa ligasi</div>
                    <div class="custom-option" data-value="Chempionlar">Chempionlar ligasi</div>
                </div>
            </div>
        </div>
        
        <div id="loadingTeams" class="teams-grid">
            <!-- Skeleton 1 -->
            <div class="team-card-public skeleton-card">
                <div class="skeleton-circle" style="width: 100px; height: 100px; min-width: 100px; min-height: 100px; border-radius: 50%; margin: 0 auto 15px auto; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1);"></div>
                <div class="skeleton-line" style="width: 120px; height: 20px; margin: 0 auto 8px auto;"></div>
                <div class="skeleton-line" style="width: 80px; height: 14px; margin: 0 auto;"></div>
            </div>
            <!-- Skeleton 2 -->
            <div class="team-card-public skeleton-card">
                <div class="skeleton-circle" style="width: 100px; height: 100px; min-width: 100px; min-height: 100px; border-radius: 50%; margin: 0 auto 15px auto; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1);"></div>
                <div class="skeleton-line" style="width: 120px; height: 20px; margin: 0 auto 8px auto;"></div>
                <div class="skeleton-line" style="width: 80px; height: 14px; margin: 0 auto;"></div>
            </div>
            <!-- Skeleton 3 -->
            <div class="team-card-public skeleton-card">
                <div class="skeleton-circle" style="width: 100px; height: 100px; min-width: 100px; min-height: 100px; border-radius: 50%; margin: 0 auto 15px auto; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1);"></div>
                <div class="skeleton-line" style="width: 120px; height: 20px; margin: 0 auto 8px auto;"></div>
                <div class="skeleton-line" style="width: 80px; height: 14px; margin: 0 auto;"></div>
            </div>
            <!-- Skeleton 4 -->
            <div class="team-card-public skeleton-card hide-mobile">
                <div class="skeleton-circle" style="width: 100px; height: 100px; min-width: 100px; min-height: 100px; border-radius: 50%; margin: 0 auto 15px auto; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1);"></div>
                <div class="skeleton-line" style="width: 120px; height: 20px; margin: 0 auto 8px auto;"></div>
                <div class="skeleton-line" style="width: 80px; height: 14px; margin: 0 auto;"></div>
            </div>
        </div>

        <div id="teamsGrid" class="teams-grid hidden">
            <!-- Teams will be injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script>lucide.createIcons();</script>
    <script src="js/layout.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/teams-public.js"></script>
</body>
</html>
