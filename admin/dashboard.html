<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFL - Admin Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Admin CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../logo.PNG" alt="Logo" class="sidebar-logo">
                <h2>HFL Admin</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-filter="all">
                    <i data-lucide="layout-dashboard" class="icon"></i> Barchasi
                </a>
                <a href="#" class="nav-item" data-filter="pending">
                    <i data-lucide="clock" class="icon"></i> Kutilmoqda
                </a>
                <a href="#" class="nav-item" data-filter="approved">
                    <i data-lucide="check-circle" class="icon"></i> Tasdiqlangan
                </a>
                <a href="#" class="nav-item" data-filter="rejected">
                    <i data-lucide="x-circle" class="icon"></i> Rad etilgan
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="exportBtn" class="action-btn">
                    <i data-lucide="download" class="icon"></i> PDF Yuklab olish
                </button>
                <button id="logoutBtn" class="action-btn logout-btn" style="margin-top: 10px; border-color: #ef4444; color: #ef4444;">
                    <i data-lucide="log-out" class="icon"></i> Chiqish
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Ism, familiya yoki telefon orqali qidirish...">
                </div>
                
                <div class="stats-container">
                    <div class="stat-box">
                        <span class="stat-value" id="statTotal">0</span>
                        <span class="stat-label">Jami</span>
                    </div>
                    <div class="stat-box pending">
                        <span class="stat-value" id="statPending">0</span>
                        <span class="stat-label">Kutilmoqda</span>
                    </div>
                    <div class="stat-box approved">
                        <span class="stat-value" id="statApproved">0</span>
                        <span class="stat-label">Tasdiqlandi</span>
                    </div>
                </div>
            </header>

            <div class="content-area">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Rasm</th>
                                <th>F.I.SH</th>
                                <th class="hide-mobile">Pasport</th>
                                <th class="hide-mobile">Telefon</th>
                                <th>Sana</th>
                                <th>Status</th>
                                <th>Amallar</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Data will be populated here by JS -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <button id="prevPageBtn" disabled><i data-lucide="chevron-left"></i> Oldingi</button>
                    <span id="pageInfo">Sahifa 1</span>
                    <button id="nextPageBtn">Keyingi <i data-lucide="chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Details Modal -->
    <div id="detailsModal" class="modal hidden">
        <div class="modal-content large">
            <button class="close-modal" id="closeModalBtn"><i data-lucide="x"></i></button>
            <div class="details-grid">
                <div class="details-photo">
                    <img id="detailPhoto" src="" alt="Fudbolchi rasmi">
                </div>
                <div class="details-info">
                    <h2 id="detailName">Ism Familiya</h2>
                    
                    <div class="info-group">
                        <span class="info-label">Pasport:</span>
                        <span class="info-value" id="detailPassport">AA1234567</span>
                    </div>
                    
                    <div class="info-group">
                        <span class="info-label">Telefon:</span>
                        <span class="info-value" id="detailPhone">+998901234567</span>
                    </div>
                    
                    <div class="info-group">
                        <span class="info-label">Sana:</span>
                        <span class="info-value" id="detailDate">01.01.2026</span>
                    </div>
                    
                    <div class="info-group">
                        <span class="info-label">Izoh:</span>
                        <p class="info-value comment-box" id="detailComment">Izoh matni bu yerda bo'ladi...</p>
                    </div>

                    <div class="action-buttons">
                        <button class="btn-approve" id="approveBtn"><i data-lucide="check"></i> Tasdiqlash</button>
                        <button class="btn-reject" id="rejectBtn"><i data-lucide="x"></i> Rad etish</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>lucide.createIcons();</script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
