<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFL - Admin Panel Login</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Minimal inline styles for login, the rest will be in admin.css */
        :root {
            --bg-main: #f4f7fb;
            --gold-primary: #f0d060;
            --text-dark: #1a1a2e;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 100px;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Outfit', sans-serif;
            margin-bottom: 30px;
            color: var(--text-dark);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--gold-primary);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--text-dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .login-btn:hover {
            background: #2a2a4e;
        }
        .error-msg {
            color: #ef4444;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="images/logo.png" alt="Logo" class="logo">
        <h2>Admin Kirish</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Login</label>
                <input type="text" id="username" placeholder="Loginni kiriting" required>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <input type="password" id="password" placeholder="Parolni kiriting" required>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                <i data-lucide="log-in" width="20"></i> Tizimga kirish
            </button>
            <div id="errorMsg" class="error-msg">Login yoki parol xato!</div>
        </form>
    </div>

    <script>lucide.createIcons();</script>
    <script src="js/auth.js"></script>
</body>
</html>
